plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.clipper.core'
    compileSdk 36

    defaultConfig {
        applicationId 'com.clipper.core'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        debugConfig {
            if (file("${rootDir}/debug.keystore").exists()) {
                storeFile file("${rootDir}/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            if (file("${rootDir}/debug.keystore").exists()) {
                signingConfig signingConfigs.debugConfig
            }
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        if (file("/usr/bin/python3.11").exists()) {
            buildPython "/usr/bin/python3.11"
        }
        pip {
            install "requests"
            install "youtube-transcript-api==1.2.4"
            install "yt-dlp"
            install "av"
            install "soundfile"
            install "miniaudio"
        }
    }
}
